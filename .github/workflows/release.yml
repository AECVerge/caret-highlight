name: Release

# The first release is published by hand, because crates.io only offers trusted
# publishing for a crate that already exists: there is no publisher to configure
# until v0.1.0 is up. From the second release on, a `v<version>` tag drives this
# workflow — tagging is the release decision — and `workflow_dispatch` stays as
# the recovery path for a tag whose publish failed, which is why the ref is
# checked before anything is published.
on:
  # enable this after the first release:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

# `contents: read` for the checkout, `id-token: write` so the job can request
# the OIDC token that crates.io exchanges for a short-lived publishing token.
# No `CARGO_REGISTRY_TOKEN` secret exists: the point of trusted publishing.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: publish to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Guards the recovery path: a manual re-run must still be sitting on a
      # `v<version>` tag, so a dispatch from a branch cannot publish one. Pick
      # the tag as the ref when dispatching.
      - name: Check the ref is the version tag
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          expected="v${version}"
          actual="${GITHUB_REF_NAME}"
          if [ "$actual" != "$expected" ]; then
            echo "::error::ref '$actual' does not match version v${version}"
            exit 1
          fi

      # `@stable` builds the artifact with the newest stable, which is what the
      # published crate should be built with; `rust-version` only promises that
      # it still compiles on 1.85.
      - uses: dtolnay/rust-toolchain@stable

      # No `Swatinem/rust-cache` here on purpose: `cargo publish` builds and
      # verifies the `.crate` from scratch, and a cache would only hide a build
      # that is broken from clean.
      - name: Test the tagged commit
        run: cargo test --locked

      - name: Verify the crate packages and compiles
        run: cargo publish --dry-run --locked

      # The only step that needs credentials, so the only step that gets them;
      # `id-token: write` above is what lets it request the OIDC token.
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth

      - name: Publish to crates.io
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
