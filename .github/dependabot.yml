version: 2
updates:
  # The workflows pin every action to a commit SHA, so the version in the
  # trailing comment is what an update bumps; Dependabot keeps both in step.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Its ref is the toolchain to install, not a version, so a bump would ask
      # rustup for a release that may not exist. The MSRV moves by hand, in step
      # with `rust-version` in Cargo.toml.
      - dependency-name: dtolnay/rust-toolchain
