[package]
name = "caret-highlight"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Build and render rustc-style highlighted code snippets"
license = "MIT OR Apache-2.0"
keywords = ["diagnostics", "snippet", "rustc", "caret"]
categories = ["development-tools", "text-processing"]
repository = "https://github.com/AECVerge/caret-highlight"
exclude = ["/.github", "/AGENTS.md"]

[dependencies]
unicode-width = { version = "0.2", optional = true }

[features]
default = ["unicode-width"]

[package.metadata.docs.rs]
all-features = true
